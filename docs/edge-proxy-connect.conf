# DRAFT for Pierce's edge nginx proxy (playbook Section 3). NOT APPLIED.
# Applying this, and publishing DNS, makes Connect reachable from the
# internet: go-live needs "Confirm 1 of 2" and "Confirm 2 of 2" first.
#
# Replace <LXC_INTERNAL_IP>. Keep X-Forwarded-For OVERWRITTEN (not appended)
# so clients cannot spoof their IP. The LXC's router trusts this header only
# from TRUSTED_PROXY_IP in /opt/connect/.env.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name connect.mhits.au;
    # ssl_certificate / ssl_certificate_key: existing proxy certificate process

    client_max_body_size 5m;

    location / {
        proxy_pass http://<LXC_INTERNAL_IP>:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# turn.mhits.au is NOT proxied: DNS only, straight to the public IP
# (3478 udp/tcp, 5349 tcp, 49160-49200 udp).
