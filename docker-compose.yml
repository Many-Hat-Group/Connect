# Connect: one app per LXC. See docs/ARCHITECTURE.md.
name: connect

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  PUBLIC_URL: ${PUBLIC_URL:?set in .env}
  DATABASE_URL: postgresql+asyncpg://connect:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/connect
  REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?set in .env}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set in .env}
  TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set in .env}
  TURN_HOST: ${TURN_HOST:-}
  SETUP_TOKEN: ${SETUP_TOKEN:-}
  ROUTER_IP: ${ROUTER_IP:-172.31.250.10}
  TESTING: ${TESTING:-false}
  WORKER_SWEEP_SECONDS: ${WORKER_SWEEP_SECONDS:-15}

networks:
  internal:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.31.250.0/24}
          # Dynamic addresses come from the upper half; fixed ones (router)
          # live in the lower half.
          ip_range: ${DOCKER_IP_RANGE:-172.31.250.128/25}

services:
  router:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      app: { condition: service_healthy }
      signal: { condition: service_started }
    environment:
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:?set in .env}
      PUBLIC_HOST: ${PUBLIC_HOST:?set in .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./router/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./vendor/vdo.ninja:/srv/vdo:ro
    ports:
      - "${ROUTER_BIND_IP:?set in .env}:8080:8080"
    networks:
      internal:
        ipv4_address: ${ROUTER_IP:-172.31.250.10}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: connect-app:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *app-env
    volumes:
      - media:/data/media
      - rustdesk:/data/rustdesk
    networks: [internal]

  worker:
    image: connect-app:local
    restart: unless-stopped
    logging: *logging
    depends_on:
      app: { condition: service_healthy }
    environment: *app-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - media:/data/media
      - rustdesk:/data/rustdesk
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3

  signal:
    build:
      context: .
      dockerfile: signal/Dockerfile
    image: connect-signal:local
    restart: unless-stopped
    logging: *logging
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: connect
      POSTGRES_DB: connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes", "--save", "300 10"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}

  backup:
    image: postgres:16.10-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: connect
      PGDATABASE: connect
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-02:30}
    volumes:
      - ./backup:/opt/backup:ro
      - backups:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U connect -d connect"]
      interval: 60s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    logging: *logging
    network_mode: host
    entrypoint: ["/bin/sh", "/etc/coturn-tmpl/entrypoint.sh"]
    command: []
    environment:
      TURN_LISTEN_IP: ${TURN_LISTEN_IP:?set in .env}
      TURN_RELAY_IP: ${TURN_RELAY_IP:?set in .env}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?set in .env}
      TURN_REALM: ${TURN_HOST:?set in .env}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?set in .env}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_EXTRA_DENIED_RANGES: ${TURN_EXTRA_DENIED_RANGES:-}
      TURN_TEST_APPEND: ${TURN_TEST_APPEND:-}
    volumes:
      - ./coturn:/etc/coturn-tmpl:ro
      - turncerts:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 $${TURN_LISTEN_IP} >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/dns-cloudflare:v5.8.0
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/opt/certbot/run.sh"]
    environment:
      TURN_HOST: ${TURN_HOST:?set in .env}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-}
    volumes:
      - ./certbot:/opt/certbot:ro
      - letsencrypt:/etc/letsencrypt
      - turncerts:/certs
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sleep' >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  media:
  rustdesk:
  turncerts:
  letsencrypt:
  backups:
