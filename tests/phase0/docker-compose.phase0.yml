# Phase 0 spike overlay: a TLS edge proxy that mimics Pierce's nginx proxy,
# and a stub "app" that validates signal tokens and serves the test harness.
# Paths are relative to the repository root (first compose file).
services:
  edge:
    image: nginx:1.28.0-alpine
    depends_on: [router]
    volumes:
      - ./tests/phase0/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/.certs:/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      internal:
        ipv4_address: 172.31.250.5

  app:
    image: python:3.12.11-slim-bookworm
    build: !reset null
    depends_on: !reset []
    command: ["python", "-u", "/stub/authstub.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/spike/frame.html')"]
      interval: 5s
      retries: 10
    environment:
      SPIKE_TOKENS: ${SPIKE_TOKENS:-pubtoken,viewtoken}
    volumes:
      - ./tests/phase0:/stub:ro
    networks: [internal]

  # Not needed for the spike.
  worker:
    profiles: [unused]
  backup:
    profiles: [unused]
  certbot:
    profiles: [unused]
  postgres:
    profiles: [unused]
  redis:
    profiles: [unused]

  coturn:
    volumes:
      - ./coturn:/etc/coturn-tmpl:ro
      - ./tests/.certs:/certs:ro
