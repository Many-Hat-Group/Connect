# Simulated LXC: adds a TLS edge proxy stand-in in front of the real stack.
services:
  edge:
    image: nginx:1.30.5-alpine
    depends_on: [router]
    volumes:
      - ./tests/phase0/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/.certs:/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      internal:
        ipv4_address: 172.31.250.5
