# E2E stack: the real compose stack plus a TLS edge stand-in. App code is
# mounted read-only so changes do not need an image rebuild.
services:
  edge:
    image: nginx:1.30.5-alpine
    depends_on: [router]
    volumes:
      - ./tests/phase0/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/.certs:/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      internal:
        ipv4_address: 172.31.250.5
  app:
    volumes:
      - ./app:/srv/connect/app:ro
  worker:
    volumes:
      - ./app:/srv/connect/app:ro
  coturn:
    volumes:
      - ./coturn:/etc/coturn-tmpl:ro
      - ./tests/.certs:/certs:ro
  certbot:
    profiles: [unused]
  backup:
    profiles: [unused]
