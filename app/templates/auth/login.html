{% extends "auth/layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">For {{ brand.company_name }} staff only.</p>
{% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit" class="btn primary">Continue</button>
</form>
{% endblock %}
