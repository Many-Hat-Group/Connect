# Internal router for the Connect LXC. Rendered by the nginx image's
# envsubst template step (only ${UPPERCASE} environment variables are
# substituted; nginx's own $lowercase variables are left alone).
#
# Traffic arrives from the edge nginx proxy (TLS terminated there) on 8080.

# Trust X-Forwarded-For only from the edge proxy.
set_real_ip_from ${TRUSTED_PROXY_IP};
real_ip_header X-Forwarded-For;
real_ip_recursive off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Never log query strings: they can carry signal tokens.
log_format connect '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';

# Docker's embedded DNS, so upstreams can restart without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout connect;
    client_max_body_size 5m;

    set $app_upstream http://app:8000;
    set $signal_upstream http://signal:8443;

    # Security headers common to every response. Pages served by the app
    # set their own strict CSP; /vdo/ sets a looser one below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Unmodified VDO.Ninja, read-only, pinned tag. Only ever framed by our
    # own pages. CSP allows only this origin, our signal endpoint and blob
    # or mediastream sources. ICE servers (STUN and TURN) are not governed by
    # CSP; they are pinned by the URL parameters the app builds.
    # Without the trailing slash VDO.Ninja treats "vdo" as a room name.
    location = /vdo { return 301 /vdo/; }

    location /vdo/ {
        alias /srv/vdo/;
        index index.html;
        etag on;
        # Block repository metadata and docs that have no business being served.
        location ~ /\.(git|github) { return 404; }
        # VDO.Ninja is only ever loaded inside our own frames. Refuse top-level
        # navigation (browsers that send Fetch Metadata) so a crafted /vdo/ link
        # cannot run VDO.Ninja as a full page on our origin.
        if ($http_sec_fetch_dest = "document") { return 403; }
        location ~* \.(md|sh|sample|conf)$ { return 404; }

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' wss://${PUBLIC_HOST}/signal; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" always;
        # VDO.Ninja's iframe API has no origin check and accepts "eval", so it
        # must never be framed by anyone else.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), autoplay=(self), fullscreen=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        # Public static files, no credentials. Needed because VDO.Ninja loads
        # its scripts with crossorigin and the tech viewer runs it in a
        # sandboxed (opaque origin) iframe.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # VDO.Ninja handshake server. Every connection must carry a short-lived
    # per-participant token (?t=...) that the app validates.
    location = /signal {
        auth_request /_signal_auth;
        proxy_pass $signal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        limit_except GET { deny all; }
    }

    location = /_signal_auth {
        internal;
        proxy_pass $app_upstream/internal/signal-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Internal endpoints are never reachable from outside.
    location ^~ /internal/ { return 404; }

    # Websockets for the portal and customer pages.
    location ^~ /ws/ {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        # RustDesk installers are large; stream them.
        proxy_buffering off;
    }
}
